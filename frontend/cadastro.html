<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro - MoneyUp</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card form-card">
        <h1>Criar conta</h1>
        <form id="signupForm">
          <div class="field">
            <label for="nome">Nome</label>
            <input id="nome" type="text" required />
          </div>
          <div class="field">
            <label for="email">E-mail</label>
            <input id="email" type="email" required />
          </div>
          <div class="field">
            <label for="senha">Senha</label>
            <input id="senha" type="password" required />
          </div>
          <div id="error" class="error"></div>
          <div class="button-group">
            <button class="button primary">Cadastrar</button>
            <a href="login.html" class="button outline">Já tenho conta</a>
          </div>
        </form>
      </section>
    </main>
    <script type="module">
      import { register } from "./js/auth.mjs";
      const form = document.getElementById("signupForm");
      const nome = document.getElementById("nome");
      const email = document.getElementById("email");
      const senha = document.getElementById("senha");
      const error = document.getElementById("error");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        error.textContent = "";
        try {
          await register(nome.value, email.value, senha.value);
          window.location.href = "login.html";
        } catch (err) {
          error.textContent = err?.message || JSON.stringify(err);
        }
      });
    </script>
  </body>
</html>
