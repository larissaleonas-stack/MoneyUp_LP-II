<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Gastos</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>

  <body>
    <main class="page">
      <section class="card form-card">
        <div class="page-header">
          <span class="brand-icon">📝</span>
          <div>
            <h1>Adicionar Gasto</h1>
            <p class="subtitle">
              Preencha os dados e registre seu gasto rapidamente.
            </p>
          </div>
        </div>

        <div class="form-grid">
          <div class="field">
            <span>Nome do gasto</span>
            <input
              type="text"
              id="nome"
              placeholder="Ex: Mercado, Combustível"
            />
          </div>
          <div class="field">
            <span>Valor</span>
            <input type="number" id="valor" placeholder="Ex: 150" />
          </div>
          <div class="field">
            <span>Nome do usuário</span>
            <input type="text" id="usuario" placeholder="Ex: Larissa" />
          </div>
          <div class="field">
            <span>Categoria</span>
            <div id="categoriaGroup" class="option-grid"></div>
            <input type="hidden" id="categoria" />
          </div>
          <div class="field">
            <span>Forma de pagamento</span>
            <div id="formaGroup" class="option-grid"></div>
            <input type="hidden" id="formaPagamento" />
          </div>
        </div>

        <div id="optionsStatus" class="options-status"></div>

        <div class="button-group">
          <button id="salvarBtn" class="button primary full">Salvar</button>
          <a href="tela3.html" class="button outline full">Ver Gastos</a>
        </div>

        <div id="spinner"></div>
        <div id="message"></div>
      </section>
    </main>

    <script type="module">
      import { getToken } from "./js/auth.mjs";
      if (!getToken()) {
        window.location.href = "login.html";
      }
    </script>
    <script type="module" src="./js/cadastro.mjs"></script>
  </body>
</html>
